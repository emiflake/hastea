# Editor support (HLS). HLS cannot use GHC's wasm cross-compiler, so the
# package is loaded with your ordinary GHC, through cabal.project.hls, where
# stand-ins take the place of the imports from JavaScript. That needs
# hastea-ffi-stand-in on the PATH: install hastea-cli (see its README).
#
# hastea-cli/ has a hie.yaml of its own.
cradle:
  cabal:
    cabalProject: cabal.project.hls
    components:
      - path: "./hastea-html/src"
        component: "hastea:lib:hastea-html"
      - path: "./hastea-html/test"
        component: "hastea:test:hastea-html-test"
      - path: "./hastea-html/support"
        component: "hastea:lib:test-support"
      - path: "./hastea-component/src"
        component: "hastea:lib:hastea-component"
      - path: "./hastea-component/test"
        component: "hastea:test:hastea-component-test"
      - path: "./hastea-core"
        component: "hastea:lib:hastea"
      - path: "./examples/todomvc"
        component: "hastea:exe:hastea-todomvc"
      - path: "./examples/ReactComparison"
        component: "hastea:exe:hastea-react-comparison"
      - path: "./benchmark"
        component: "hastea:exe:hastea-benchmark"
